<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Home 💖</title>

  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;500&display=swap" rel="stylesheet">
</head>

<body>

<div id="effects"></div>

<div class="home">

  <!-- LEFT BUTTONS -->
  <div class="side left">
   <a href="reason.html">
   <button>1000 Reasons 💌</button>
</a>
    <button>Memories 📸</button>
    <button>Songs 🎶</button>
  </div>

  <!-- CENTER TEXT -->
  <div class="center">
    <h1>Happiest Birthday<br>Moiiii Rasmalai 💖🎀</h1>
  </div>

  <!-- RIGHT BUTTONS -->
  <div class="side right">
    <button>Edits ✨</button>
    <button>Message 💌</button>
    <button>Exit 🚪</button>
  </div>

</div>

<script>
// floating hearts + stars
function createEffect(type, emoji){
  const el = document.createElement("div");
  el.classList.add(type);
  el.innerHTML = emoji;

  el.style.left = Math.random() * 100 + "vw";
  el.style.fontSize = (Math.random() * 18 + 10) + "px";
  el.style.animationDuration = (Math.random() * 3 + 4) + "s";

  document.getElementById("effects").appendChild(el);

  setTimeout(() => el.remove(), 7000);
}

setInterval(() => createEffect("heart", "💖"), 300);
setInterval(() => createEffect("star", "✨"), 500);
</script>

</body>
</html>
